<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現在の適応モード観察 | LunaRa Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --deep: #080608;
  --dark: #120D10;
  --mid: #1E1518;
  --text-bright: #F5EDE0;
  --text-mid: #C8B09A;
  --text-dim: #7A6A60;
  --magenta: #C45C8A;
  --teal: #3DA8B8;

  /* モードカラー */
  --m1: #C45C8A;
  --m2: #E8A020;
  --m3: #8B6FD4;
  --m4: #5B8FD4;
  --m5: #4A9E8C;
  --m6: #B8845A;
  --m7: #3DA8B8;
  --m8: #C9A84C;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--deep);
  color: var(--text-bright);
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

.cosmos {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 70% 50% at 20% 10%, rgba(196,92,138,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 50% 60% at 80% 80%, rgba(201,168,76,0.05) 0%, transparent 55%),
    linear-gradient(160deg, #080608 0%, #12080E 40%, #080A12 100%);
  pointer-events: none;
}

.cosmos::after {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 15% 20%, rgba(196,92,138,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 8%, rgba(240,210,200,0.3) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 65% 25%, rgba(201,168,76,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 15%, rgba(240,210,200,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 65%, rgba(196,92,138,0.3) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 70% 70%, rgba(201,168,76,0.3) 0%, transparent 100%);
  animation: starPulse 8s ease-in-out infinite alternate;
}

@keyframes starPulse { 0%{opacity:.5} 100%{opacity:1} }

.page {
  position: relative; z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

.screen { display: none; }
.screen.active { display: block; animation: fadeUp 0.7s ease forwards; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}

@keyframes questionIn {
  from { opacity:0; transform:translateX(16px); }
  to { opacity:1; transform:translateX(0); }
}

.question-animate {
  animation: questionIn 0.4s ease forwards;
}

#question-area {
  transition: opacity 0.25s ease;
}

/* COVER */
.cover {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 60px 0;
}

.cover-badge {
  font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: 0.4em;
  color: var(--gold); opacity: 0.8;
  margin-bottom: 32px;
}

.cover-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(28px, 7vw, 48px);
  font-weight: 300; line-height: 1.25;
  margin-bottom: 8px;
}

.cover-title em { font-style: italic; color: var(--gold-light); display: block; }

.cover-line {
  display: flex; align-items: center; gap: 16px;
  width: 100%; max-width: 300px;
  margin: 24px auto 32px;
}
.cover-line::before, .cover-line::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(196,92,138,0.4), transparent);
}
.cover-line span { color: var(--magenta); font-size: 12px; }

.cover-desc {
  font-size: 14px; color: var(--text-mid);
  line-height: 2.2; max-width: 420px;
  margin: 0 auto 40px;
}

.cover-desc strong { color: var(--gold-light); font-weight: 400; }

.btn-start {
  display: inline-block;
  background: linear-gradient(135deg, rgba(196,92,138,0.15), rgba(196,92,138,0.05));
  border: 1px solid rgba(196,92,138,0.4);
  color: #E8A8C8;
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; letter-spacing: 0.15em;
  padding: 18px 48px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-start:hover {
  border-color: var(--magenta);
  box-shadow: 0 0 30px rgba(196,92,138,0.12);
  transform: translateY(-2px);
}

/* PROGRESS */
.progress-wrap {
  padding: 48px 0 32px;
  display: flex; align-items: center; gap: 14px;
}

.progress-bar {
  flex: 1; height: 2px;
  background: rgba(196,92,138,0.1);
  border-radius: 1px; overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--magenta), #E8A8C8);
  transition: width 0.5s ease;
}

.progress-label {
  font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--text-dim); white-space: nowrap;
}

/* QUESTION */
.q-category {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 0.3em;
  color: var(--magenta); opacity: 0.8;
  text-transform: uppercase; margin-bottom: 14px;
}

.q-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 4.5vw, 28px);
  font-weight: 300; line-height: 1.6;
  color: var(--text-bright); margin-bottom: 8px;
}

.q-sub {
  font-size: 13px; color: var(--text-mid);
  line-height: 1.9; margin-bottom: 36px;
  padding: 12px 16px;
  border-left: 1px solid rgba(196,92,138,0.3);
  background: rgba(196,92,138,0.04);
}

.options { display: flex; flex-direction: column; gap: 10px; }

.option-btn {
  background: rgba(30,21,24,0.7);
  border: 1px solid rgba(196,92,138,0.1);
  border-radius: 2px;
  padding: 16px 20px;
  cursor: pointer; text-align: left;
  color: var(--text-mid);
  font-family: 'Noto Serif JP', serif;
  font-size: 13px; letter-spacing: 0.05em;
  line-height: 1.7;
  transition: all 0.25s;
  width: 100%;
}

.option-btn:hover {
  border-color: rgba(196,92,138,0.35);
  background: rgba(196,92,138,0.07);
  color: var(--text-bright);
}

.option-btn.selected {
  border-color: rgba(196,92,138,0.6);
  background: rgba(196,92,138,0.12);
  color: var(--text-bright);
}

/* RESULT */
.result-header {
  padding: 60px 0 32px;
  text-align: center;
}

.result-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 0.4em;
  color: var(--text-dim); margin-bottom: 20px;
}

.result-mode-badge {
  display: inline-block;
  padding: 8px 20px;
  border: 1px solid;
  font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: 0.3em;
  margin-bottom: 24px;
}

.result-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(32px, 8vw, 52px);
  font-weight: 300; line-height: 1.2;
  margin-bottom: 8px;
}

.result-title em { font-style: italic; }

.result-oneliner {
  font-size: 14px; color: var(--text-mid);
  line-height: 2; max-width: 460px;
  margin: 0 auto 48px;
}

/* METER */
.meter-section {
  background: rgba(18,13,16,0.8);
  border: 1px solid rgba(196,92,138,0.1);
  padding: 28px 24px; margin-bottom: 32px;
}

.meter-label {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 0.35em;
  color: var(--text-dim); margin-bottom: 24px;
  text-align: center;
}

.meter-row {
  display: flex; align-items: center;
  gap: 14px; margin-bottom: 16px;
}

.meter-name {
  font-size: 12px; color: var(--text-mid);
  width: 80px; flex-shrink: 0; text-align: right;
  line-height: 1.4;
}

.meter-bar {
  flex: 1; height: 6px;
  background: rgba(255,255,255,0.07);
  border-radius: 3px; overflow: hidden;
}

.meter-bar-inner {
  height: 100%; border-radius: 3px;
  transition: width 1.2s ease;
}

/* CARDS */
.result-card {
  border-left: 2px solid;
  padding: 20px 0 20px 24px;
  margin-bottom: 24px;
}

.result-card-label {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 0.35em;
  margin-bottom: 10px;
}

.result-card-body {
  font-size: 14px; color: var(--text-mid);
  line-height: 2.2;
}

.result-card-body li {
  list-style: none;
  padding-left: 16px;
  position: relative;
  margin-bottom: 6px;
}

.result-card-body li::before {
  content: '◆';
  position: absolute; left: 0;
  font-size: 7px; top: 6px;
}

/* OBSERVATION WORK */
.obs-work {
  background: rgba(196,92,138,0.04);
  border: 1px solid rgba(196,92,138,0.12);
  padding: 28px 24px; margin-bottom: 24px;
}

.obs-title {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 0.35em;
  color: var(--magenta); margin-bottom: 16px;
}

.obs-body {
  font-size: 14px; color: var(--text-mid);
  line-height: 2.4;
}

.obs-body em {
  color: var(--gold-light);
  font-style: normal;
}

/* TODAY STEP */
.today-step {
  background: rgba(201,168,76,0.04);
  border: 1px solid rgba(201,168,76,0.1);
  padding: 28px 24px; margin-bottom: 24px;
}

.today-step-label {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 0.35em;
  color: var(--gold); margin-bottom: 14px;
}

.today-step-body {
  font-size: 14px; color: var(--text-mid);
  line-height: 2.4;
}

/* BODY SIGNAL */
.body-signal {
  padding: 20px 0 20px 20px;
  border-left: 1px solid rgba(201,168,76,0.2);
  margin-bottom: 24px;
}

.body-signal-label {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 0.35em;
  color: var(--text-dim); margin-bottom: 10px;
}

.body-signal-body {
  font-size: 13px; color: var(--text-dim);
  line-height: 2.2; font-style: italic;
}

/* WARNING */
.warning-text {
  font-size: 12px; color: var(--text-dim);
  line-height: 2; text-align: center;
  padding: 20px 0;
  border-top: 1px solid rgba(255,255,255,0.04);
  margin-bottom: 32px;
}

/* CTA */
.cta-section {
  padding: 32px 0 0;
  text-align: center;
}

.cta-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px; font-weight: 300;
  line-height: 1.6; margin-bottom: 12px;
}

.cta-title em { font-style: italic; color: var(--gold-light); }

.cta-sub {
  font-size: 13px; color: var(--text-dim);
  line-height: 2; margin-bottom: 20px;
}

.btn-line {
  display: block;
  border: 1px solid rgba(201,168,76,0.35);
  color: var(--text-mid);
  font-family: 'Noto Serif JP', serif;
  font-size: 13px; letter-spacing: 0.1em;
  padding: 16px 28px;
  text-decoration: none;
  transition: all 0.3s;
  margin-bottom: 14px;
  text-align: center;
}

.btn-line:hover {
  border-color: rgba(201,168,76,0.6);
  color: var(--gold-light);
}

.btn-line.primary {
  background: linear-gradient(135deg, rgba(196,92,138,0.15), rgba(196,92,138,0.05));
  border-color: rgba(196,92,138,0.4);
  color: #E8A8C8;
}

.btn-line.primary:hover {
  border-color: var(--magenta);
  color: #F0C0D8;
}

.cta-note {
  font-size: 11px; color: var(--text-dim);
  letter-spacing: 0.08em; margin-top: 16px;
}

.restart-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-family: 'Noto Serif JP', serif;
  font-size: 12px; letter-spacing: 0.1em;
  cursor: pointer; padding: 8px;
  transition: color 0.3s;
  margin-top: 12px;
}

.restart-btn:hover { color: var(--text-mid); }

/* DIVIDER */
.divider {
  height: 1px; margin: 32px 0;
  background: linear-gradient(90deg, transparent, rgba(196,92,138,0.15), transparent);
}
</style>
</head>

// スコア配点
const scoreMap = { 0: 0, 1: 0, 2: 1, 3: 2, 4: 3 };

let currentQ = 0;
let scores = {};
let history = [];

function initScores() {
  Object.keys(modes).forEach(k => scores[k] = 0);
  history = [];
}

function startDiagnosis() {
  initScores();
  currentQ = 0;
  showScreen('screen-questions');
  renderQuestion();
}

function goBack() {
  if (currentQ <= 0 || history.length === 0) return;
  const prev = history.pop();
  const q = questions[prev.qIndex];
  const sc = scoreMap[prev.val];
  Object.entries(q.modes).forEach(([mode, weight]) => {
    scores[mode] = Math.max(0, (scores[mode] || 0) - sc * weight);
  });
  currentQ--;
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const pct = (currentQ / questions.length * 100).toFixed(0);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = (currentQ + 1) + ' / ' + questions.length;

  const opts = [
    'とても近い',
    'どちらかといえば近い',
    'どちらとも言えない',
    'あまり近くない',
    'わからない',
  ];

  const area = document.getElementById('question-area');
  area.style.opacity = '0';

  setTimeout(() => {
    area.innerHTML = `
      <div class="question-animate">
        <div class="q-category">OBSERVATION · ${String(currentQ + 1).padStart(2,'0')}</div>
        <div class="q-text">${q.text}</div>
        ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
        <div class="options">
          ${opts.map((o, i) => `
            <button class="option-btn" onclick="selectAnswer(${i})">${o}</button>
          `).join('')}
        </div>
        ${currentQ > 0 ? `
        <div style="text-align:center;margin-top:24px;">
          <button class="restart-btn" onclick="goBack()">← 前の質問に戻る</button>
        </div>` : ''}
      </div>
    `;
    requestAnimationFrame(() => {
      area.style.opacity = '1';
    });
  }, 250);
}

function selectAnswer(val) {
  const area = document.getElementById('question-area');
  area.style.opacity = '0';

  const q = questions[currentQ];
  const sc = scoreMap[val];
  history.push({ qIndex: currentQ, val });
  Object.entries(q.modes).forEach(([mode, weight]) => {
    scores[mode] = (scores[mode] || 0) + sc * weight;
  });

  currentQ++;
  setTimeout(() => {
    area.innerHTML = '';
    if (currentQ >= questions.length) {
      showResult();
    } else {
      renderQuestion();
    }
  }, 250);
}

function showResult() {
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const mainKey = sorted[0][0];
  const main = modes[mainKey];

  // パーセント計算
  const total = sorted.reduce((s, [, v]) => s + v, 0);
  let running = 0;
  const meterData = sorted.map(([key, val], i) => {
    let pct;
    if (i === sorted.length - 1) {
      pct = Math.max(0, 100 - running);
    } else {
      pct = total > 0 ? Math.floor(val / total * 100) : 0;
      running += pct;
    }
    return { key, val, pct, mode: modes[key] };
  });

  showScreen('screen-result');

      </a>

      <div class="divider"></div>

      <div style="padding:24px;background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.08);margin-bottom:20px;">
        <div style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.35em;color:var(--gold);margin-bottom:14px;">◆ 観察を続けるために</div>
        <p style="font-size:13px;color:var(--text-dim);line-height:2.4;">

  setTimeout(() => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.querySelectorAll('.meter-bar-inner').forEach(el => {
          el.style.width = el.dataset.pct + '%';
        });
      });
    });
  }, 300);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartApp() {
  initScores();
  currentQ = 0;
  showScreen('screen-cover');
}
